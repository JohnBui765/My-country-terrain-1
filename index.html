/* ---------- Tokens. The map keeps its atlas colours; the controls follow iOS. ---------- */
:root {
  --sea: #cfe6f0;
  --sea-ink: #2d6a93;
  --other: #ebe5d6;
  --coast: #a99d87;
  --frontier: #7c705c;
  --paper: #fffdf8;
  --border: #8b7d67;
  --ink: #1f2b33;
  --muted: #5b6870;
  --hl: #ffd43b;
  --ok: #23824d;
  --okf: #a9dfbb;
  --bad: #c43b3b;
  --badf: #f4b4ae;
  --cap: #e3262f;
  --dim: #e6eaec;
  --fog: #e4ebee;
  --wisp: #ffffff;
  --surface: #fffdf8;
  --material: rgba(255, 253, 248, .8);
  --fill: rgba(118, 118, 128, .12);
  --hair: rgba(31, 43, 51, .14);
  --tint: #1d6a98;
  --shadow: 0 10px 30px rgba(16, 32, 44, .16), 0 1px 3px rgba(16, 32, 44, .1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sea: #0f2533;
    --sea-ink: #86b9db;
    --other: #1a2b35;
    --coast: #44596a;
    --frontier: #8ba2b3;
    --paper: #2a3a45;
    --border: #7590a1;
    --ink: #e7eef2;
    --muted: #a7b6c0;
    --hl: #ffd43b;
    --ok: #6ad39a;
    --okf: #2c6a49;
    --bad: #ff8077;
    --badf: #7c3030;
    --cap: #ff5a5f;
    --dim: #22323c;
    --fog: #0a1820;
    --wisp: #22394a;
    --surface: #1b2b35;
    --material: rgba(27, 43, 53, .8);
    --fill: rgba(118, 118, 128, .26);
    --hair: rgba(231, 238, 242, .16);
    --tint: #7cc3ee;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--fog); color: var(--ink);
  font: 15px/1.45 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
}
body { position: fixed; inset: 0; touch-action: none; }
/* Pinch-zoom of the page is blocked everywhere (touch-action is intersected down the tree);
   the scrolling parts reset it and allow their own direction only. */
.sheet-body, .namelist { touch-action: pan-y; }
#chips { touch-action: pan-x; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; }
.material { background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); }
@media (prefers-reduced-transparency: reduce) { .material { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; } }

/* ---------- Map: three bitmaps the GPU moves; see section 3 of the script ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: var(--fog);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage > * { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; will-change: transform; }
#live canvas, #live svg, #fog canvas { position: absolute; left: 0; top: 0; }
#fog { transition: opacity 1.4s ease; }
#fog.pending { opacity: 0; }
#fogB { animation: drift 46s ease-in-out infinite alternate; will-change: transform, opacity; }
@keyframes drift { from { transform: translate(-1.1%, .7%); opacity: .45; } to { transform: translate(1.1%, -.7%); opacity: 1; } }
#fx { overflow: visible; }
.fxp { fill: transparent; fill-rule: evenodd; }
.fxp.bad { animation: flashbad .9s ease-out forwards; }
.fxp.ok { animation: flashok .7s ease-out forwards; }
@keyframes flashbad { 0%, 35% { fill: var(--bad); } 100% { fill: transparent; } }
@keyframes flashok { 0%, 30% { fill: var(--ok); } 100% { fill: transparent; } }
.mark { fill: none; stroke: var(--bad); }

/* ---------- Top card ---------- */
.slip {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  width: min(460px, calc(100% - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  border: .5px solid var(--hair); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px 14px;
}
.slip[hidden] { display: none; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.kicker { color: var(--muted); font-size: 13px; font-weight: 600; }
.big { font-size: clamp(24px, 7vw, 30px); font-weight: 700; line-height: 1.15; letter-spacing: -.015em; }
.hlw { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding: 0 .08em; }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fb { margin-top: 6px; font-weight: 600; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }
.x { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--fill); color: var(--muted);
  display: grid; place-items: center; padding: 0; position: relative; }
.x::after { content: ''; position: absolute; inset: -6px; }
.x svg { width: 12px; height: 12px; }

.btn { border: 0; background: var(--fill); border-radius: 12px; padding: 10px 16px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--ink); color: var(--surface); }
.btn:disabled { opacity: .45; }
.btn:active, .chip:active, .mode:active, .tab:active, .ctrl button:active { opacity: .6; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.choices .btn { min-height: 52px; font-size: 16px; text-align: left; }
.choices .btn.right { background: var(--okf); box-shadow: inset 0 0 0 2px var(--ok); }
.choices .btn.wrong { background: var(--badf); box-shadow: inset 0 0 0 2px var(--bad); }
.answer { display: flex; gap: 8px; margin-top: 10px; }
.answer input { flex: 1; min-width: 0; font-size: 17px; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--fill); min-height: 44px; }
.toggles { display: flex; gap: 6px 18px; flex-wrap: wrap; }
.sw { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; min-height: 44px; -webkit-user-select: none; user-select: none; }
.sw input { margin: 0; flex: none; }
html:not(.native-switch) .sw input { -webkit-appearance: none; appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--fill); position: relative; transition: background .2s; cursor: pointer; }
html:not(.native-switch) .sw input::before { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .22); transition: transform .2s; }
html:not(.native-switch) .sw input:checked { background: #34c759; }
html:not(.native-switch) .sw input:checked::before { transform: translateX(18px); }
.timer { height: 4px; background: var(--hl); border-radius: 2px; margin-top: 8px; transform-origin: left; }

/* ---------- Region chips, map controls, tab bar ---------- */
#chips { position: fixed; left: 0; right: 0; z-index: 9; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding: 2px max(12px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px));
  bottom: calc(var(--tabs-h, 60px) + 6px); scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; position: relative; border: .5px solid var(--hair); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; font-size: 14px; font-weight: 600; min-height: 36px; box-shadow: 0 1px 3px rgba(16, 32, 44, .1); }
.chip::after { content: ''; position: absolute; inset: -4px -1px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.rc { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 4px 16px 4px 5px; text-align: left; line-height: 1.15; scroll-snap-align: start; }
.chip.rc.all { padding-left: 16px; }
.chip.rc .num { flex: none; min-width: 34px; height: 34px; padding: 0 6px; border-radius: 17px; display: grid; place-items: center; background: var(--fill); font-size: 12.5px; font-weight: 700; }
.chip.rc .vi { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.chip.rc[aria-pressed="true"] .vi { color: inherit; opacity: .75; }
.chip.rc[aria-pressed="true"] .num { background: rgba(255, 255, 255, .2); }
.ctrl { position: fixed; z-index: 9; right: calc(env(safe-area-inset-right, 0px) + 10px); border: .5px solid var(--hair);
  border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.ctrl button { width: 46px; height: 46px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); padding: 0; }
.ctrl svg { width: 20px; height: 20px; }
.ctrl hr { margin: 0 9px; border: 0; border-top: .5px solid var(--hair); }
#zoom { bottom: calc(var(--tabs-h, 60px) + var(--chips-h, 0px) + 70px); }
#zfit { bottom: calc(var(--tabs-h, 60px) + var(--chips-h, 0px) + 12px); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 22; display: flex; justify-content: center;
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  border-top: .5px solid var(--hair); }
.tab { flex: 1; max-width: 150px; height: 52px; border: 0; background: none; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; padding: 4px 0 0; font-size: 10.5px; font-weight: 600; color: var(--muted); }
.tab svg { width: 26px; height: 26px; }
.tab[aria-selected="true"] { color: var(--tint); }

/* ---------- Sheets ---------- */
#scrim { position: fixed; inset: 0; z-index: 19; background: rgba(10, 20, 28, .3); opacity: 0; pointer-events: none; transition: opacity .25s; }
#scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 50%; bottom: var(--tabs-h, 60px); z-index: 20; width: min(560px, 100%);
  max-height: min(calc(var(--app-h, 100vh) - var(--tabs-h, 60px) - env(safe-area-inset-top, 0px) - 16px), 760px);
  display: flex; flex-direction: column; transform: translate(-50%, 105%); transition: transform .34s cubic-bezier(.2, .9, .25, 1);
  background: var(--surface); border: .5px solid var(--hair); border-bottom: 0; border-radius: 18px 18px 0 0;
  box-shadow: 0 -6px 30px rgba(16, 32, 44, .14); visibility: hidden; }
.sheet.open { transform: translate(-50%, 0); visibility: visible; }
.sheet.dragging { transition: none; }
.sheet.dock { max-height: calc(var(--app-h, 100vh) * .46); z-index: 11; }
.sheet.dock.tall { max-height: calc(var(--app-h, 100vh) * .58); }
.grab { flex: none; height: 22px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grab::before { content: ''; width: 38px; height: 5px; border-radius: 3px; background: var(--hair); }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 16px 18px; }
.sheet h2 { font-size: 22px; margin: 0; line-height: 1.2; letter-spacing: -.01em; }
.sheet h3 { font-size: 13px; margin: 20px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sheet p { margin: 6px 0; }
.drag-row { touch-action: none; }
.sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.modes { display: grid; gap: 8px; margin-top: 12px; }
.mode { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-radius: 14px; background: var(--fill); text-align: left; min-height: 60px; }
.mode b { display: block; font-size: 16px; }
.mode small { display: block; color: var(--muted); font-size: 13px; }
.mode .go { margin-left: auto; font-weight: 700; white-space: nowrap; color: var(--tint); }
.mode.rec { box-shadow: inset 0 0 0 2px var(--ink); }
.mode.rec b span { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); }
.scope { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.scope .chip.rc { box-shadow: none; }
.facts { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.link { border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 2px; font-weight: 600; color: var(--tint); }
.nbs { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: .5px solid var(--hair); }
.bar { height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.legend { height: 12px; border-radius: 6px; margin-top: 8px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.misses { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.namelist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-height: calc(var(--app-h, 100vh) * .36); overflow: auto; padding: 2px; }
.namelist .chip { font-size: 14px; box-shadow: none; }
.small { font-size: 13px; color: var(--muted); }

/* ---------- Statistics table ---------- */
table.stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; margin-top: 10px; }
.stats th, .stats td { padding: 9px 4px; text-align: right; font-weight: 400; }
.stats thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); font-size: 11.5px; line-height: 1.25; color: var(--muted); font-weight: 600; vertical-align: bottom; box-shadow: inset 0 -.5px 0 var(--hair); }
.stats th:nth-child(2), .stats td:nth-child(2) { text-align: left; padding-left: 8px; }
.stats td:first-child, .stats th:first-child { width: 2.4em; color: var(--muted); }
.stats tbody tr[data-c] { cursor: pointer; }
.stats tbody tr[data-c] td { border-bottom: .5px solid var(--hair); }
.stats tbody tr[data-c]:active, .stats tbody tr[aria-selected="true"] { background: color-mix(in srgb, var(--hl) 40%, transparent); }
.stats .rh th, .stats .rh td { padding-top: 18px; font-weight: 700; vertical-align: top; }
.stats .rh th { text-align: left; }
.stats .rh .vi { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); }
.stats .rh b { display: inline-block; min-width: 2.2em; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 25; max-width: calc(100% - 40px);
  bottom: calc(var(--tabs-h, 60px) + var(--chips-h, 0px) + 18px); background: var(--ink); color: var(--surface);
  padding: 10px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; box-shadow: var(--shadow); text-align: center; }
#toast.on { opacity: 1; }

@media (min-width: 900px) {
  .slip { left: 24px; transform: none; }
  #chips { justify-content: center; }
  .sheet.dock { left: 24px; width: 460px; bottom: auto; top: calc(var(--slip-b, 80px) + 12px); max-height: calc(var(--app-h, 100vh) - var(--slip-b, 80px) - var(--tabs-h, 60px) - 36px);
    border: .5px solid var(--hair); border-radius: 18px; box-shadow: var(--shadow); transform: translateX(-110%); }
  .sheet.dock.open { transform: none; }
  .sheet.dock .grab { display: none; }
  .sheet.dock .sheet-body { padding-top: 16px; }
}
/* Landscape phones: compact bars, as iOS does, so the map keeps most of the height. */
@media (max-height: 500px) {
  .tab { flex-direction: row; height: 40px; gap: 6px; padding: 0; font-size: 12.5px; }
  .tab svg { width: 22px; height: 22px; }
  .slip { padding: 6px 12px 8px; border-radius: 16px; }
  .slip .big { font-size: 22px; }
  .sw { min-height: 36px; }
  .chip.rc { min-height: 40px; padding: 2px 14px 2px 4px; }
  .chip.rc .num { min-width: 30px; height: 30px; }
  .chip.rc .vi { font-size: 11px; }
  .ctrl button { width: 42px; height: 42px; }
  #zoom { bottom: calc(var(--tabs-h, 60px) + var(--chips-h, 0px) + 60px); }
  #zfit { bottom: calc(var(--tabs-h, 60px) + var(--chips-h, 0px) + 10px); }
  .sheet.dock { max-height: calc(var(--app-h, 100vh) * .62); }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, #scrim, #toast, #fog { transition: none; }
  #fogB { animation: none; }
  .fxp.bad, .fxp.ok { animation-duration: .01s; }
}
</style>

/* ---------- 10. Spaced repetition ----------
   Each province has three skills: find (locate it), name (recall its name), nb (its neighbours).
   Boxes 0–5; a right answer moves up a box and waits longer; a wrong one drops two boxes and is due now. */
const DAYS = [0, 1, 2, 4, 9, 21];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const DAY = 864e5;
function rec(c, skill) { store.srs[c] = store.srs[c] || {}; return (store.srs[c][skill] = store.srs[c][skill] || { b: 0, n: 0, due: 0 }); }
function record(c, skill, ok) {
  const s = rec(c, skill), now = Date.now();
  s.n++; s.last = now;
  if (ok) { s.b = Math.min(5, s.b + 1); s.due = now + DAYS[s.b] * DAY * (0.9 + Math.random() * 0.2); }
  else { s.b = Math.max(0, s.b - 2); s.due = now; }
  if (!store.intro.includes(c)) store.intro.push(c);
  const day = ymd(new Date());
  store.days[day] = (store.days[day] || 0) + 1;
  save();
}
const box = (c, skill) => (store.srs[c] && store.srs[c][skill] ? store.srs[c][skill].b : 0);
const mastery = c => (box(c, 'find') + box(c, 'name')) / 2;
function streak() {
  const d = new Date();
  if (!store.days[ymd(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (store.days[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// Weakest first, ties shuffled — so practice hits what you know least.
function byWeakness(codes, skill) { return shuffle(codes.slice()).sort((a, b) => box(a, skill) - box(b, skill)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// New provinces are introduced in the order of the Atlat table: region I first, number 1 to 63.
const LEARN_ORDER = PROV.map(p => p.c);
function dueTests() {
  const now = Date.now(), out = [];
  for (const c of store.intro) for (const skill of ['find', 'name']) { const s = store.srs[c] && store.srs[c][skill]; if (s && s.due <= now) out.push({ type: skill, c, due: s.due }); }
  return out.sort((a, b) => a.due - b.due);
}
function nextDue() {
  let t = Infinity;
  for (const c of store.intro) for (const skill of ['find', 'name']) { const s = store.srs[c] && store.srs[c][skill]; if (s) t = Math.min(t, s.due); }
  return t;
}

// Drag the sheet down by its handle or its title row to put it away.
{
  let drag = null;

    if (vw >= 900 && sheet.classList.contains('dock')) return;

    drag = { id: e.pointerId, y: e.clientY, t: performance.now(), dy: 0 };
    sheet.setPointerCapture(e.pointerId); sheet.classList.add('dragging');
  });
  sheet.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y;
    drag.dy = dy > 0 ? dy : -rubber(-dy, 60);

    if (!drag || e.pointerId !== drag.id) return;

    if (drag.dy > Math.min(120, sheet.offsetHeight * .3) || (drag.dy > 30 && v > .5)) dismissSheet();

  else if (id === 'name') items = byWeakness(scope, 'name').map(c => ({ type: 'name', c }));
  else items = byWeakness(scope.filter(c => BY[c].nb.length), 'nb').map(c => ({ type: 'nb', c }));
  if (!items.length) {
    const t = nextDue();
    toast(t < Infinity ? `All caught up. Next review ${t - Date.now() < DAY ? 'later today' : 'in ' + Math.ceil((t - Date.now()) / DAY) + ' days'}.` : 'All 63 started and nothing is due. Try Rebuild.', 3500);
    return showPracticePicker();
  }
  runSession({ mode: id, scope, scopeKey, items });
}
function buildReview() {
  const due = shuffle(dueTests().slice(0, 20).map(({ type, c }) => ({ type, c })));
  const room = Math.max(0, Math.min(6, Math.ceil((24 - due.length) / 3)));
  const fresh = LEARN_ORDER.filter(c => !store.intro.includes(c)).slice(0, room);
  const q = due.slice();
  fresh.forEach((c, i) => {
    const at = Math.min(q.length, i * 3);
    q.splice(at, 0, { type: 'meet', c });
    q.splice(Math.min(q.length, at + 4), 0, { type: 'find', c });
    q.splice(Math.min(q.length, at + 8), 0, { type: 'name', c });
  });
  return q;
}

// One engine runs Daily review, Find it, Name it and Neighbours.
function runSession(cfg) {
  view = 'practice'; setTab('practice');
  practiceMap(); clearChips();
  session = {
    ...cfg, queue: cfg.items.slice(), total: cfg.items.filter(i => i.type !== 'meet').length,
    done: 0, firstTry: 0, tried: new Set(), misses: new Set(), t0: Date.now(), cur: null, waiting: false,
    tap: () => {}, key: () => {},
  };
  const outside = new Set(ALL.filter(c => !cfg.scope.includes(c)));
  outside.forEach(c => mark.dim.add(c));
  labelWanted = p => forcedLabel.has(p.c);
  setSlip(`${header('Get ready')}<div class="big">&nbsp;</div>`);
  paintAll(); fitScope(cfg.scope);
  setTimeout(() => nextItem(), 60);
}
function header(kind) {
  const s = session;
  return `<div class="row"><div class="grow kicker">${esc(kind)}</div><span class="meta">${Math.min(s.done + 1, s.total)} of ${s.total}</span>${closeBtn('id="endBtn"', 'End round')}</div>`;
}
function wireEnd() { const b = $('endBtn'); if (b) b.onclick = () => finishSession(true); }
function resetItemMarks() {
  ['target', 'ok', 'miss', 'reveal'].forEach(k => mark[k].clear()); forcedLabel.clear(); clearFx();
  mapOpt.noBorders = false; invalidate();
}
function nextItem() {
  const s = session; if (!s) return;
  resetItemMarks();
  s.waiting = false;
  const it = s.cur = s.queue.shift();
  if (!it) return finishSession(false);
  ({ meet: itemMeet, find: itemFind, name: itemName, nb: itemNb })[it.type](it);
  paintAll();
  wireEnd();
}
// Count only the first attempt at each item for scoring and for spaced repetition.
function score(it, ok, skill) {
  const s = session, key = it.type + it.c;
  if (!s.tried.has(key)) {
    s.tried.add(key);
    if (ok) s.firstTry++; else s.misses.add(it.c);
    record(it.c, skill, ok);
  }
  if (ok) s.done++;
  else s.queue.splice(Math.min(3, s.queue.length), 0, { ...it });
}
function continueBtn(label = 'Next') {
  return `<div class="btnrow"><button type="button" class="btn primary" id="nextBtn">${label}</button></div>`;
}
function wireNext() { const b = $('nextBtn'); if (b) { b.onclick = () => nextItem(); b.focus({ preventScroll: true }); } }

function itemMeet(it) {
  const p = BY[it.c], r = REGIONS[p.r];
  mark.target.add(it.c); forcedLabel.add(it.c);
  setSlip(`<div class="row"><div class="grow kicker">New province · No. ${p.stt}</div>${closeBtn('id="endBtn"', 'End round')}</div>
    <div class="big"><span class="hlw">${esc(p.n)}</span></div>
    <div class="small">${esc(regionLine(p.r))} (<span lang="vi">${esc(r.vi)}</span>)${p.cap ? `. Capital ${esc(p.cap)}` : ''}. Borders ${p.nb.map(c => esc(BY[c].n)).join(', ') || 'no land neighbours'}.</div>
    ${continueBtn('Got it')}`);
  wireNext(); ensureVisible(it.c);
  session.tap = () => {}; session.key = e => { if (e.key === 'Enter') nextItem(); };
}

function itemFind(it) {
  const p = BY[it.c], hidden = store.set.noBorders;
  mapOpt.noBorders = hidden;
  setSlip(`${header(hidden ? 'Find it — borders hidden' : 'Find it')}<div class="big">${esc(p.n)}</div><div id="fb"></div>`);
  session.key = e => { if (session.waiting && e.key === 'Enter') nextItem(); };
  session.tap = (code, w) => {
    if (session.waiting) return;
    if (hidden) tapMark(w);
    if (code === it.c) {
      score(it, true, 'find'); mark.ok.add(it.c); forcedLabel.add(it.c); paint(it.c); flash(it.c, 'ok'); onZoomEnd();
      $('fb').innerHTML = '<div class="fb ok">Correct</div>';
      session.waiting = true; setTimeout(() => { if (session && session.cur === it) nextItem(); }, 650);
      return;
    }
    score(it, false, 'find');
    session.waiting = true;
    mark.target.add(it.c); forcedLabel.add(it.c); mark.reveal.add(it.c);
    let msg;
    if (hidden) msg = `${Math.max(1, Math.round(kmToProvince(it.c, w)))} km off. ${esc(p.n)} is highlighted.`;
    else if (code) { forcedLabel.add(code); mark.miss.add(code); paint(code); msg = `That’s ${esc(BY[code].n)}. ${esc(p.n)} is highlighted.`; }
    else msg = `That’s the sea. ${esc(p.n)} is highlighted.`;
    paint(it.c); onZoomEnd(); flash(code, 'bad');
    $('fb').innerHTML = `<div class="fb bad">${msg}</div>${continueBtn()}`;
    wireNext(); ensureVisible(it.c);
  };
}

function itemName(it) {
  const p = BY[it.c];
  mark.target.add(it.c); paint(it.c);
  ensureVisible(it.c);
  const typing = store.set.typing && !session.sprint;
  let body;
  if (typing) {
    body = `<form class="answer" id="ansForm" autocomplete="off"><input id="ans" type="text" inputmode="text" autocapitalize="words" autocorrect="off" spellcheck="false" placeholder="Type the name" aria-label="Province name"><button class="btn primary" type="submit">Check</button></form>`;
  } else {
    // Decoys come from the neighbours, then the neighbours' neighbours: look-alikes, not giveaways.
    const pool = shuffle(p.nb.slice()).slice(0, 3);
    const hop2 = shuffle([...new Set(p.nb.flatMap(c => BY[c].nb))].filter(c => c !== p.c && !pool.includes(c)));
    while (pool.length < 3 && hop2.length) pool.push(hop2.shift());
    if (pool.length < 3) shuffle(PROV.filter(q => q.r === p.r && q.c !== p.c && !pool.includes(q.c)).map(q => q.c)).slice(0, 3 - pool.length).forEach(c => pool.push(c));
    if (pool.length < 3) shuffle(ALL.filter(c => c !== p.c && !pool.includes(c))).slice(0, 3 - pool.length).forEach(c => pool.push(c));
    body = `<div class="choices">${shuffle([it.c, ...pool]).map((c, i) => `<button type="button" class="btn" data-pick="${c}"><span class="small">${i + 1}</span> ${esc(BY[c].n)}</button>`).join('')}</div>`;
  }
  setSlip(`${session.sprint ? sprintHead() : header('Name the highlighted province')}${body}<div id="fb"></div>`);
  const answer = (code, typed) => {
    if (session.waiting) return;
    const ok = code === it.c;
    if (!session.sprint) score(it, ok, 'name'); else sprintScore(it, ok);
    forcedLabel.add(it.c);
    if (ok) {
      mark.target.delete(it.c); mark.ok.add(it.c); paint(it.c); flash(it.c, 'ok'); onZoomEnd();
      $('fb').innerHTML = `<div class="fb ok">${typed && typed.near ? `Correct. Spelling: ${esc(p.n)}` : 'Correct'}</div>`;
      sheetMarkChoice(code, true);
      session.waiting = true; setTimeout(() => { if (session && session.cur === it) nextItem(); }, typed && typed.near ? 1300 : 650);
      return;
    }
    session.waiting = true; sheetMarkChoice(code, false); sheetMarkChoice(it.c, true);
    let msg = `It’s ${esc(p.n)}.`;
    if (code) { mark.miss.add(code); forcedLabel.add(code); paint(code); flash(code, 'bad'); msg = `${esc(BY[code].n)} is the one in red. This is ${esc(p.n)}.`; }
    else if (typed && typed.raw) msg = `“${esc(typed.raw)}” isn’t a province name. This is ${esc(p.n)}.`;
    onZoomEnd();
    if (session.sprint) { $('fb').innerHTML = `<div class="fb bad">${msg}</div>`; setTimeout(() => { if (session && session.cur === it) nextItem(); }, 900); return; }
    $('fb').innerHTML = `<div class="fb bad">${msg}</div>${continueBtn()}`; wireNext();
  };
  if (typing) {
    const inp = $('ans'); setTimeout(() => inp.focus({ preventScroll: true }), 50);
    $('ansForm').onsubmit = e => { e.preventDefault(); if (session.waiting) return nextItem(); const raw = inp.value.trim(); if (!raw) return; const m = matchName(raw); answer(m ? m.p.c : null, { near: m && m.near, raw }); };
  } else {
    slip.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => answer(b.dataset.pick));
  }
  session.tap = (code) => { if (!session.waiting && code) toast('Answer in the box at the top'); };
  session.key = e => {
    if (session.waiting && e.key === 'Enter' && !typing) return nextItem();
    if (!typing && !session.waiting && /^[1-4]$/.test(e.key)) { const b = slip.querySelectorAll('[data-pick]')[+e.key - 1]; if (b) b.click(); }
  };
}
function sheetMarkChoice(code, right) {
  const b = slip.querySelector(`[data-pick="${code}"]`);
  if (b) b.classList.add(right ? 'right' : 'wrong');
}

function itemNb(it) {
  const p = BY[it.c], need = new Set(p.nb), found = new Set();
  let errors = 0, revealed = false;
  mark.target.add(it.c); forcedLabel.add(it.c); paint(it.c);
  { const b = p.box, m = Math.max(b[2], b[3]) * 1.6; flyTo([b[0] - m, b[1] - m, b[2] + 2 * m, b[3] + 2 * m], 1); }
  const render = (extra = '') => {
    setSlip(`${header('Tap every neighbour of')}<div class="big">${esc(p.n)}</div>
      <div class="meta" style="margin-top:4px">${found.size} of ${need.size} found${errors ? `, ${errors} wrong` : ''}</div>
      <div id="fb">${extra}</div>`);
    wireEnd();
  };
  const finish = (ok, msg) => {
    session.waiting = true; score(it, ok, 'nb');
    render(`<div class="fb ${ok ? 'ok' : 'bad'}">${msg}</div>${continueBtn()}`); wireNext();
  };
  render(`<div class="btnrow"><button type="button" class="btn" id="giveUp">Show the rest</button></div>`);
  const wireGive = () => { const g = $('giveUp'); if (g) g.onclick = () => {
    revealed = true;
    need.forEach(c => { if (!found.has(c)) { mark.miss.add(c); forcedLabel.add(c); mark.reveal.add(c); paint(c); } });
    onZoomEnd(); finish(false, `Missed ${[...need].filter(c => !found.has(c)).map(c => esc(BY[c].n)).join(', ')}.`);
  }; };
  wireGive();
  session.key = e => { if (session.waiting && e.key === 'Enter') nextItem(); };
  session.tap = code => {
    if (session.waiting || !code || code === it.c || found.has(code)) return;
    if (need.has(code)) {
      found.add(code); mark.ok.add(code); forcedLabel.add(code); paint(code); flash(code, 'ok'); onZoomEnd();
      if (found.size === need.size) return finish(errors === 0 && !revealed, errors ? `All ${need.size} found, with ${errors} wrong.` : `All ${need.size} found.`);
      render(`<div class="btnrow"><button type="button" class="btn" id="giveUp">Show the rest</button></div>`); wireGive();
    } else {
      errors++; flash(code, 'bad'); toast(`${BY[code].n} doesn’t border ${p.n}`);
      render(`<div class="btnrow"><button type="button" class="btn" id="giveUp">Show the rest</button></div>`); wireGive();
    }
  };
}

function finishSession(aborted) {
  const s = session; if (!s) return;
  clearInterval(s.timer); session = null;
  const progressed = s.mode === 'rebuild' ? s.filled.size > 0 : s.mode === 'sprint' ? s.points + s.wrong > 0 : s.tried.size > 0;
  if (aborted && !progressed) { resetItemMarks(); return showPracticePicker(); }
  const secs = Date.now() - s.t0;
  let title, lines = '';
  if (s.mode === 'rebuild') {
    const n = s.filled.size, all = s.scope.length;
    title = n === all ? 'Map rebuilt' : `${n} of ${all} placed`;
    let best = '';
    if (n === all && !s.gaveUp) {
      const k = 'rebuild:' + s.scopeKey, b = store.best[k];
      if (!b || secs < b.ms || (secs === b.ms && s.errors < b.err)) { store.best[k] = { ms: secs, err: s.errors }; save(); best = 'New personal best.'; }
      else best = `Best: ${fmtTime(b.ms)}.`;
    }
    lines = `<p class="big" style="margin-top:6px">${fmtTime(secs)}</p><p>${s.errors} wrong ${s.errors === 1 ? 'guess' : 'guesses'}${s.gaveUp ? ', some revealed' : ''}. ${best}</p>`;
  } else if (s.mode === 'sprint') {
    title = 'Time’s up';
    const k = 'sprint:' + s.scopeKey, b = store.best[k];
    let best = '';
    if (!b || s.points > b.score) { store.best[k] = { score: s.points }; save(); best = s.points ? 'New personal best.' : ''; }
    else best = `Best: ${b.score}.`;
    lines = `<p class="big" style="margin-top:6px">${s.points} right</p><p>${s.wrong} wrong in 60 seconds. ${best}</p>`;
  } else {
    title = aborted ? 'Round ended' : 'Round complete';
    const asked = s.tried.size;
    lines = `<p class="big" style="margin-top:6px">${s.firstTry} of ${asked}</p><p>right first time, in ${fmtTime(secs)}.</p>`;
  }
  const missChips = [...s.misses].map(c => `<button type="button" class="chip" data-go="${c}">${esc(BY[c].n)}</button>`).join('');
  resetItemMarks(); setSlip(null);
  s.misses.forEach(c => { mark.miss.add(c); forcedLabel.add(c); });
  paintAll();
  openSheet(`<div class="drag-row"><h2>${title}</h2></div>${lines}
    ${missChips ? `<h3>To work on</h3><div class="misses">${missChips}</div>` : ''}
    <div class="btnrow"><button type="button" class="btn primary" id="again">Practise again</button><button type="button" class="btn" id="done">Done</button></div>`, true);
  sheetBody.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { closeSheet(); ensureVisible(b.dataset.go); toast(BY[b.dataset.go].n); });
  $('again').onclick = () => startMode(s.mode);
  $('done').onclick = () => showPracticePicker();
}
function endSession(silent) {
  if (!session) return;
  clearInterval(session.timer); session = null;
  if (!silent) showPracticePicker();
}

/* ---------- 14. Rebuild: the blank map, filled from memory ---------- */
function startRebuild(scope, scopeKey) {
  view = 'practice'; setTab('practice'); practiceMap(); clearChips();
  const outside = ALL.filter(c => !scope.includes(c)); outside.forEach(c => mark.dim.add(c));
  const s = session = { mode: 'rebuild', scope, scopeKey, filled: new Set(), errors: 0, t0: Date.now(), active: null, tried: new Set(), misses: new Set(), done: 0, gaveUp: false, locked: false, key: () => {} };
  labelWanted = p => s.filled.has(p.c) || forcedLabel.has(p.c);
  const noB = store.set.noBorders;
  mapOpt.noBorders = noB;
  const head = () => `<div class="row"><div class="grow kicker">Rebuild${noB ? ' — borders hidden' : ''}</div><span class="meta" id="clock">${fmtTime(Date.now() - s.t0)}</span><span class="meta">${s.filled.size} of ${scope.length}</span>${closeBtn('id="endBtn"', 'End round')}</div>`;
  const idle = () => {
    s.active = null;
    setSlip(`${head()}<div class="big" style="font-size:20px">${noB ? 'Tap a spot, then name the province there' : 'Tap any province and name it'}</div>${s.errors ? `<div class="meta">${s.errors} wrong</div>` : ''}<div class="btnrow"><button type="button" class="btn" id="reveal">Reveal the rest</button></div>`);
    wireEnd(); $('reveal').onclick = () => { if (confirmInline('reveal', 'Tap again to reveal every remaining name')) giveUp(); };
  };
  const giveUp = () => {
    s.gaveUp = true;
    scope.forEach(c => { if (!s.filled.has(c)) { s.misses.add(c); mark.miss.add(c); forcedLabel.add(c); } });
    paintAll(); finishSession(false);
  };
  const ask = code => {
    s.active = code;
    ALL.forEach(c => mark.target.delete(c)); mark.target.add(code); paintAll();
    const typing = store.set.typing;
    const remaining = scope.filter(c => !s.filled.has(c)).sort((a, b) => norm(BY[a].n).localeCompare(norm(BY[b].n)));
    const body = typing
      ? `<form class="answer" id="ansForm" autocomplete="off"><input id="ans" type="text" autocapitalize="words" autocorrect="off" spellcheck="false" placeholder="Name this province" aria-label="Province name"><button class="btn primary" type="submit">Check</button></form>`
      : `<div class="namelist">${remaining.map(c => `<button type="button" class="chip" data-pick="${c}">${esc(BY[c].n)}</button>`).join('')}</div>`;
    setSlip(`${head()}${body}<div id="fb"></div><div class="btnrow"><button type="button" class="btn" id="cancel">Not this one</button></div>`);
    wireEnd(); requestAnimationFrame(() => panIntoView(code));
    $('cancel').onclick = () => { mark.target.delete(code); paint(code); idle(); };
    const check = (pick, raw, near) => {
      const key = 'rb' + code;
      if (pick === code) {
        if (!s.tried.has(key)) { s.tried.add(key); record(code, 'name', true); }
        s.filled.add(code); mark.target.delete(code); mark.done.add(code); clearFx(); paint(code); flash(code, 'ok'); onZoomEnd();
        if (near) toast(`Spelling: ${BY[code].n}`);
        if (s.filled.size === scope.length) return finishSession(false);
        return idle();
      }
      s.errors++;
      if (!s.tried.has(key)) { s.tried.add(key); s.misses.add(code); record(code, 'name', false); }
      flash(code, 'bad');
      const msg = pick ? `Not ${esc(BY[pick].n)}. Try again, or pick another province.` : raw ? `“${esc(raw)}” isn’t a province name. Try again.` : 'Try again.';
      $('fb').innerHTML = `<div class="fb bad">${msg}</div>`;
      const b = pick && slip.querySelector(`[data-pick="${pick}"]`); if (b) b.classList.add('wrong');
    };
    if (typing) {
      const inp = $('ans'); setTimeout(() => inp.focus({ preventScroll: true }), 50);
      $('ansForm').onsubmit = e => { e.preventDefault(); const raw = inp.value.trim(); if (!raw) return; const m = matchName(raw); check(m ? m.p.c : null, raw, m && m.near); inp.select(); };
    } else slip.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => check(b.dataset.pick));
  };
  s.tap = (code, w) => {
    if (!code) return;
    if (!scope.includes(code)) return toast('That province is outside this area');
    if (s.filled.has(code)) return toast(`${BY[code].n} is already placed`);
    if (noB) tapMark(w);
    ask(code);
  };
  s.timer = setInterval(() => { const c = $('clock'); if (c) c.textContent = fmtTime(Date.now() - s.t0); }, 1000);
  paintAll(); fitScope(scope); setTimeout(idle, 30);
}

/* ---------- 15. Sprint: 60 seconds, mixed find and name ---------- */
function startSprint(scope, scopeKey) {
  view = 'practice'; setTab('practice'); practiceMap(); clearChips();
  ALL.filter(c => !scope.includes(c)).forEach(c => mark.dim.add(c));
  const s = session = { mode: 'sprint', sprint: true, scope, scopeKey, points: 0, wrong: 0, t0: Date.now(), end: Date.now() + 60000,
    tried: new Set(), misses: new Set(), done: 0, firstTry: 0, queue: [], total: 0, cur: null, tap: () => {}, key: () => {} };
  labelWanted = p => forcedLabel.has(p.c);
  let last = null;
  s.queue = { shift: () => { let c; do { c = scope[Math.floor(Math.random() * scope.length)]; } while (scope.length > 1 && c === last); last = c; return { type: Math.random() < 0.5 ? 'find' : 'name', c }; }, splice() {} };
  s.timer = setInterval(() => {
    const left = s.end - Date.now(), bar = $('tbar'), sec = $('tsec');
    if (bar) bar.style.transform = `scaleX(${Math.max(0, left / 60000)})`;
    if (sec) sec.textContent = Math.max(0, Math.ceil(left / 1000));
    if (left <= 0) finishSession(false);
  }, 200);
  paintAll(); fitScope(scope);
  setTimeout(() => nextSprint(), 60);
}
function sprintHead() {
  const s = session;
  return `<div class="row"><div class="grow kicker">Sprint</div><span class="meta">${s.points} right</span><span class="meta"><span id="tsec">${Math.ceil((s.end - Date.now()) / 1000)}</span> s</span>${closeBtn('id="endBtn"', 'End round')}</div><div class="timer" id="tbar" style="transform:scaleX(${(s.end - Date.now()) / 60000})"></div>`;
}
function sprintScore(it, ok) {
  const s = session; const key = it.type + it.c;
  if (ok) s.points++; else { s.wrong++; s.misses.add(it.c); }
  if (!s.tried.has(key)) { s.tried.add(key); record(it.c, it.type === 'find' ? 'find' : 'name', ok); }
}
function nextSprint() {
  const s = session; if (!s || !s.sprint) return;
  resetItemMarks(); s.waiting = false;
  const it = s.cur = s.queue.shift();
  if (it.type === 'name') { itemName(it); paintAll(); wireEnd(); return; }
  const p = BY[it.c];
  setSlip(`${sprintHead()}<div class="kicker" style="margin-top:6px">Find</div><div class="big">${esc(p.n)}</div><div id="fb"></div>`);
  wireEnd();
  s.tap = code => {
    if (s.waiting) return;
    const ok = code === it.c; sprintScore(it, ok); s.waiting = true;
    forcedLabel.add(it.c);
    if (ok) { mark.ok.add(it.c); flash(it.c, 'ok'); } else { mark.target.add(it.c); if (code) { mark.miss.add(code); flash(code, 'bad'); } }
    paintAll();
    setTimeout(() => { if (session === s) nextSprint(); }, ok ? 350 : 900);
  };
  paintAll();
}
// In a sprint, itemName's auto-advance calls nextItem(); route it back to the sprint.
const _nextItem = nextItem;
nextItem = function () { if (session && session.sprint) return nextSprint(); return _nextItem(); };

};
setTabsH();
let lastW = innerWidth, lastH = innerHeight, resizeRaf = 0;
addEventListener('resize', () => {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    const cx = (lastW / 2 - cam.x) / cam.k, cy = (lastH / 2 - cam.y) / cam.k, kRel = cam.k / kFit;
    stopAnim(); setTabsH(); setChipsH(); sizeLive(); limits();
    Object.assign(cam, hardClamp({ k: kFit * kRel, x: innerWidth / 2 - cx * kFit * kRel, y: innerHeight / 2 - cy * kFit * kRel }));
    if (pts.size) resync();
    lastW = innerWidth; lastH = innerHeight; commit();
  });
});
sizeLive();
showLearn();
limits();
Object.assign(cam, hardClamp(camFor(homeBox(), 1.04)));
renderBack(); commit();
// Canvas text needs the typeface loaded; measure again once it is.
if (document.fonts && document.fonts.load) {
  Promise.all(['600 12px', 'italic 400 11px', '700 10px', '400 11px'].map(f => document.fonts.load(`${f} "Be Vietnam Pro"`, 'Aă Đđ Ơơ Ưư ỗ'))).then(() => { widths.clear(); invalidate(); }).catch(() => {});
}
setTimeout(() => buildFog(() => { paintFog(); fogW.classList.remove('pending'); }), 120);
if (!store.intro.length) setTimeout(() => toast('Pinch to zoom, double-tap to zoom in. Tap any province.', 3600), 700);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* preview frames can't register workers */ }
}
</script>
